  # - { date: 2027-02-??, name: "Tết Nguyên Đán" }      # TODO(leader): fill in
  # - { date: 2027-04-??, name: "Giỗ Tổ Hùng Vương" }   # TODO(leader): fill in
  - { date: 2027-04-30, name: "Reunification Day" }
  - { date: 2027-05-01, name: "International Labour Day" }

