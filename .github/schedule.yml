# TrekLink schedule configuration — drives the automated countdown.
#
# Edit this file, not the scripts. It is read by .github/scripts/countdown.py, which
# posts the countdown into each daily-report issue and refreshes the README block.
#
# Two independent clocks (see 01-conventions/12-communication-and-daily-reports.md §5):
#   * sprints  — team-internal, 2 weeks, self-imposed
#   * roadmap  — external, graded, immovable
# A week where both land is flagged as a COLLISION, because those are the weeks
# things get dropped.

timezone: Asia/Ho_Chi_Minh          # ICT, UTC+7

sprints:
  start: 2026-09-07                 # Monday of Sprint 1 (term start)
  length_days: 14
  count: 8

# Source of truth: _docs/00-project-context/02-roadmap-and-milestones.md §3 (SEP490 model, D-013).
# `due` is the END of that week (Sunday) unless the roadmap says otherwise.
# Gates: Review 1 = W4, Review 2 = W8, Faculty Council = W13, Final Submission = W15.
roadmap:
  - { due: 2026-09-20, name: "W2 - PMP Draft, WBS, Feature Tree, Main Flow list, Risk List" }
  - { due: 2026-09-27, name: "W3 - SRS Draft, Architecture + ERD, prioritised Main Flows - CM2 Review 1 Clinic" }
  - { due: 2026-10-04, name: "REVIEW 1 - GATE 1: Proposal & Requirement", critical: true }
  - { due: 2026-10-11, name: "W5 - Architecture + ERD approved, Figma per Main Flow" }
  - { due: 2026-10-18, name: "SCOPE LOCK - registration form FROZEN", critical: true }
  - { due: 2026-10-25, name: "W7 - MF-01 + MF-02 complete, Test Plan - CM3 Review 2 Clinic", critical: true }
  - { due: 2026-11-01, name: "REVIEW 2 - GATE 2: System & Design", critical: true }
  - { due: 2026-11-08, name: "W9 - Iteration 1 review, Product v0.1" }
  - { due: 2026-11-15, name: "W10 - Iteration 2 review, all Main Flows demoable" }
  - { due: 2026-11-22, name: "W11 - FEATURE COMPLETE, Release Candidate, Report 5", critical: true }
  - { due: 2026-11-29, name: "W12 - System testing, CM4 Council Readiness, Mock Council", critical: true }
  - { due: 2026-12-06, name: "FACULTY COUNCIL - GATE 3: Final Product Evaluation", critical: true }
  - { due: 2026-12-13, name: "W14 - Feedback closure, User Guide, Installation Guide, Reports 6-7" }
  - { due: 2026-12-20, name: "FINAL SUBMISSION & DEFENSE", critical: true }

