name: Handbook

# Rebuilds TrekLink_Developer_Handbook_v1.0.pdf from the markdown SSOT whenever the
# conventions change, and commits it back so teammates get the current handbook just
# by pulling.
#
# On pull requests it only validates (no commit), so a PR that breaks the manifest
# fails visibly before it merges.
#
# Convention: _docs/handbook/README.md

on:
  push:
    branches: [dev, main]
    paths:
      - '_docs/**/*.md'
      - '_docs/handbook/**'
      - '.github/workflows/handbook.yml'
  pull_request:
    paths:
      - '_docs/**/*.md'
      - '_docs/handbook/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: handbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build handbook PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc poppler-utils
          pip install --quiet pyyaml

      # ubuntu-latest ships Google Chrome preinstalled; this is a guard, not a workaround.
      - name: Verify toolchain
        run: |
          set -euo pipefail
          pandoc --version | head -1
          google-chrome --version || chromium --version
          python3 _docs/handbook/build_handbook.py --check

      - name: Build PDF
        run: python3 _docs/handbook/build_handbook.py

      - name: Sanity-check the output
        run: |
          set -euo pipefail
          PDF="_docs/TrekLink_Developer_Handbook_v1.0.pdf"
          test -f "$PDF" || { echo "!! no PDF produced"; exit 1; }

          PAGES=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          echo "pages: $PAGES"
          # A truncated or mermaid-less build collapses well below this.
          [ "$PAGES" -ge 40 ] || { echo "!! only $PAGES pages — build looks truncated"; exit 1; }

          # Diagrams are pre-rendered to inline SVG and measured before pagination, so a
          # diagram that fails to render is already a hard build error upstream. What CI
          # checks here is the part that can still go wrong silently: figure numbering.
          #
          # Do NOT reintroduce a "raw mermaid source" text search. The old markers
          # ('commit id:', '[*] -->', '-->|') all now appear in the conventions prose —
          # 13-diagram-and-figure-conventions.md documents that exact syntax — so they
          # false-positive on a perfectly good build.
          pdftotext -layout "$PDF" - > /tmp/hb.txt

          # Every figure carries a numbered caption, and numbering must be contiguous
          # from 1 with no duplicates after the build renumbers across chapters.
          python3 - <<'PY'
          import re, sys
          text = open('/tmp/hb.txt').read()
          nums = sorted(int(n) for n in re.findall(r'Figure (\d+) — ', text))
          if len(nums) < 20:
              sys.exit(f'!! only {len(nums)} figure captions found — build looks truncated')
          dupes = sorted({n for n in nums if nums.count(n) > 1})
          if dupes:
              sys.exit(f'!! duplicate figure numbers: {dupes}')
          if nums != list(range(1, len(nums) + 1)):
              missing = [n for n in range(1, nums[-1] + 1) if n not in nums]
              sys.exit(f'!! figure numbering is not contiguous; missing {missing}')
          print(f'ok: {len(nums)} figures, numbered 1..{nums[-1]}')
          PY

          # Positive check: a node label that only exists inside a rendered diagram.
          grep -q 'IN_PROGRESS' /tmp/hb.txt || { echo "!! expected mermaid node label missing"; exit 1; }
          echo "ok: diagrams rendered"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrekLink_Developer_Handbook
          path: _docs/TrekLink_Developer_Handbook_v1.0.pdf
          retention-days: 30

      # Only commit on push to dev/main — never from a PR, which would push to a fork.
      - name: Commit rebuilt PDF
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- _docs/TrekLink_Developer_Handbook_v1.0.pdf; then
            echo "==> Handbook unchanged; nothing to commit."
            exit 0
          fi

          git add _docs/TrekLink_Developer_Handbook_v1.0.pdf _docs/handbook/assets/mermaid-*.min.js
          git commit -m "docs: rebuild developer handbook PDF [skip ci]"

          # actions/checkout pins us to github.sha — the commit that TRIGGERED this
          # run — not the branch tip. Any PR merged between that push and this step
          # leaves us behind the remote, and a bare `git push` is then rejected
          # non-fast-forward. That is exactly what killed run 35197291948: #12 merged
          # at 07:59:23, #13 at 08:00:04, and this job started at 08:02:54 holding
          # #12's SHA.
          #
          # The concurrency group above cannot help — it only serialises *handbook*
          # runs against each other, and the competing push was an ordinary merge.
          #
          # Rebase our single artifact commit onto whatever the tip is now, and
          # retry. Only this job ever commits the PDF, so a conflict on it is not
          # reachable in normal operation; if one somehow occurs, fail loudly rather
          # than resolving a binary blindly.
          for attempt in 1 2 3; do
            if git push; then
              echo "==> Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "==> Push rejected (attempt ${attempt}); rebasing onto the current tip."
            if ! git pull --rebase --no-edit; then
              git rebase --abort || true
              echo "!! Rebase failed — the handbook PDF was modified outside this job." >&2
              echo "!! Refusing to resolve a binary conflict automatically." >&2
              exit 1
            fi
          done

          echo "!! Still rejected after 3 attempts; dev is moving faster than the build." >&2
          exit 1

          # ponytail: 3 attempts is a bound, not a guarantee. If this ever exhausts,
          # the answer is a merge queue on dev, not more retries.
